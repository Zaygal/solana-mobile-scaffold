plugins {
    id 'com.android.application'
    id 'com.facebook.react'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zaygal.scaffold'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zaygal.scaffold'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        // An arm64-only APK will NOT install on the x86_64 emulator, which is
        // the only device available without Seeker hardware. Bundle every ABI
        // into one APK so a single artifact installs anywhere.
        ndk {
            abiFilters 'x86_64', 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        // Standalone diagnostic APK: bundled JS, no Metro dependency, still
        // installable with the debug key. This is the artifact we ship.
        diagnostic {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

react {
    autolinkLibrariesWithApp()
}

dependencies {
    implementation('com.facebook.react:react-android')
    if (hermesEnabled.toBoolean()) {
        implementation('com.facebook.react:hermes-android')
    }
    implementation('androidx.appcompat:appcompat:1.7.0')
}
