plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.facebook.react' version '0.86.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
}

ext {
    // Provide compatibility values for native libraries that read these from the
    // root project. kotlinVersion is required: libraries such as
    // react-native-get-random-values resolve their Kotlin Gradle plugin from
    // this property, and when it is missing the build fails with the opaque
    // "Could not find org.jetbrains.kotlin:kotlin-gradle-plugin:null".
    compileSdkVersion = 36
    targetSdkVersion = 35
    minSdkVersion = 26
    kotlinVersion = '2.1.20'

    // Pin the NDK so the C++ runtime packaged into the APK cannot drift.
    //
    // This is not cosmetic. A sibling project shipped an APK that crashed on
    // first launch because one native module was compiled with a newer NDK
    // (clang 21, whose libc++ exports __cxa_init_primary_exception) while the
    // libc++_shared.so packaged beside it came from clang 18, which does not
    // export it. The build, the bundle check and the tests all passed; only
    // dlopen on a real device failed. That project needed the newer NDK because
    // it compiles C++ from source via nitro. This one does not: nothing here
    // needs that symbol, so it stays on the toolchain that already produces a
    // working APK, and the ABI guard in CI is what watches for a dependency
    // change that would alter the requirement.
    ndkVersion = "27.3.13750724"
}

apply plugin: 'com.facebook.react.rootproject'
