name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'verifier/**'
      - '.github/workflows/apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      # Metro bundles through Babel and does not typecheck, so a type error
      # ships silently and surfaces as a runtime crash during the demo. This
      # step is the only thing standing between a typo and a broken recording.
      - name: Typecheck
        run: npm run typecheck

      # The verifier is a first-class deliverable, not a script beside the
      # project, so its known-answer tests run on every build: strictness of the
      # decode, streak counting across month and year boundaries, gap reporting,
      # and the transaction extraction path. It needs no network and no
      # dependencies, so it cannot flake.
      - name: Verifier self-test
        run: node verifier/verify.mjs --self-test

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK, and
      # android-actions/setup-android@v3 no longer works because the "tools"
      # package it bootstraps is unpublished. sdkmanager is not on PATH, so
      # locate it and skip when the packages are already present.
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK/platforms/android-36" ] && [ -d "$SDK/build-tools/36.0.0" ]; then
            echo "Required SDK packages already present."
            exit 0
          fi
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK; relying on installed packages."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build diagnostic APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=5
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if gradle --no-daemon --stacktrace :app:assembleDiagnostic; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      # Two gates, both learned the hard way:
      #  1. the JS bundle must actually be inside the APK, or the app installs
      #     and shows a red screen;
      #  2. an x86_64 native library must be present, or the APK refuses to
      #     install on the emulator we can actually demo on.
      - name: Verify APK contents
        working-directory: mobile/android
        run: |
          set -e
          APK="app/build/outputs/apk/diagnostic/app-diagnostic.apk"
          test -f "$APK"
          echo "Inspecting $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -Eq 'assets/(index\.android\.bundle|index\.android\.bundle\.packager\.map)$' \
            || { echo "FAIL: React Native bundle missing from APK"; exit 1; }
          echo "OK: React Native bundle present"
          unzip -l "$APK" | grep -Eq 'lib/x86_64/.*\.so$' \
            || { echo "FAIL: no x86_64 native libraries; this APK will not install on an x86_64 emulator"; exit 1; }
          echo "OK: x86_64 libraries present"
          unzip -l "$APK" | grep -Eq 'lib/arm64-v8a/.*\.so$' \
            || { echo "FAIL: no arm64-v8a libraries; this APK will not install on a real device"; exit 1; }
          echo "OK: arm64-v8a libraries present"

      # Which toolchain built the C++ runtime that ships in this APK. Recorded so
      # a version change is visible in the log rather than inferred later.
      - name: Record packaged libc++ fingerprint
        working-directory: mobile/android
        run: |
          APK="app/build/outputs/apk/diagnostic/app-diagnostic.apk"
          TMP=$(mktemp -d)
          unzip -o -q "$APK" 'lib/arm64-v8a/libc++_shared.so' -d "$TMP"
          echo "packaged libc++: $(readelf -p .comment "$TMP/lib/arm64-v8a/libc++_shared.so" 2>/dev/null | grep -o 'clang version [0-9.]*' | head -1)"
          rm -rf "$TMP"

      # The gate that would have caught the sibling project's device crash. It
      # resolves every undefined C++ runtime symbol in every packaged library
      # against the libc++_shared.so shipping beside it, in every ABI. A missing
      # symbol here is a guaranteed UnsatisfiedLinkError on a real device, and
      # nothing else in this workflow can see it.
      - name: Native ABI guard
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/abi-guard.sh" \
            "$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/diagnostic/app-diagnostic.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-diagnostic-apk
          path: mobile/android/app/build/outputs/apk/diagnostic/*.apk
          if-no-files-found: error
