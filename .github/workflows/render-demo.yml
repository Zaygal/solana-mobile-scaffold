name: Render Clock In demo

on:
  push:
    paths:
      - 'film/render-demo.sh'
      - 'film/clock-in-demo.mp4'
      - '.github/workflows/render-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          chmod +x film/render-demo.sh
          film/render-demo.sh

      - name: Commit rendered demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add film/clock-in-demo-v2.mp4 film/clock-in-demo-v2.srt
          git diff --cached --quiet && exit 0
          git commit -m "Create Clock In demo v2"
          git push
